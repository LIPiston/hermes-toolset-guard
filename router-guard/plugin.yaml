name: router-guard
version: 1.0.0
author: hermes-toolset-guard contributors
kind: standalone
description: >
  Front-profile router guard. Blocks file-mutating tools (write_file / patch) for
  the top-level agent of the profile this plugin is installed in, while leaving
  delegated subagents (which run as their own profile) and read-back verification
  (read_file / search_files / terminal) untouched. Mirrors OpenCode's
  orchestrator `edit: * -> deny` posture.
requires_hermes: ">=0.22"
provides_tools: []
provides_hooks:
  - pre_tool_call
tags: [router, permissions, orchestration]
